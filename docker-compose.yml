services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-management-db
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop_management
    ports:
      # 5433 on the host: a native postgresql@17 service owns localhost:5432
      - '5433:5432'
    volumes:
      - shop_management_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop_management']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shop_management_pgdata:
