openapi: 3.1.0
info:
  title: Shop Management API
  version: 0.1.0
  description: >-
    REST API for a multi-shop management system. The first use case is a
    vehicle spare-parts shop: manufacturers, categories, suppliers, vehicle
    fitment (class / make / model), a parts catalog with cross-references and
    supplier part numbers, per-shop inventory, and an append-only stock
    transaction ledger.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Manufacturers
    description: Parts manufacturers / brands (e.g. Bosch, Denso).
  - name: Categories
    description: Hierarchical part categories.
  - name: Suppliers
    description: Vendors that parts can be sourced from.
  - name: Vehicle Classes
    description: Broad vehicle classes (e.g. two-wheeler, three-wheeler, car).
  - name: Vehicle Makes
    description: Vehicle manufacturers (e.g. Honda, Maruti Suzuki).
  - name: Vehicle Models
    description: Specific vehicle models, scoped to a make and class.
  - name: Part Grades
    description: Quality grades for parts (e.g. Original, 1st Copy, 2nd Copy). User-managed lookup.
  - name: Parts
    description: The spare-parts catalog.
  - name: Part Fitments
    description: Vehicle fitment links for a part.
  - name: Part Cross References
    description: OEM, competitor, supersession and alternate numbers for a part.
  - name: Part Suppliers
    description: Supplier part numbers and preference links for a part.
  - name: Shops
    description: Individual shop locations.
  - name: Shop Users
    description: Staff accounts scoped to a shop.
  - name: Inventory
    description: Per-shop stock levels and pricing for parts.
  - name: Stock Transactions
    description: Append-only per-shop stock ledger.
security:
  - bearerAuth: []
paths:
  /api/v1/manufacturers:
    get:
      operationId: listManufacturers
      summary: List manufacturers
      tags: ["Manufacturers"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of manufacturers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManufacturerListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createManufacturer
      summary: Create a manufacturer
      tags: ["Manufacturers"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerCreate'
      responses:
        '201':
          description: The created manufacturer.
          headers:
            Location:
              description: URL of the created manufacturer.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manufacturer'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/manufacturers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      operationId: getManufacturer
      summary: Get a manufacturer by id
      tags: ["Manufacturers"]
      responses:
        '200':
          description: The manufacturer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manufacturer'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateManufacturer
      summary: Update a manufacturer
      tags: ["Manufacturers"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerUpdate'
      responses:
        '200':
          description: The updated manufacturer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manufacturer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteManufacturer
      summary: Soft-delete a manufacturer
      description: Sets `isActive` to `false`. Does not remove the row.
      tags: ["Manufacturers"]
      responses:
        '204':
          description: The manufacturer was deactivated.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List categories
      tags: ["Categories"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: parentId
          in: query
          required: false
          description: >-
            Filter to the children of this category id. Omit to return all
            categories regardless of nesting level.
          schema:
            type: integer
        - name: tree
          in: query
          required: false
          description: >-
            If true, return categories as a nested tree (root categories at
            the top level, each with a recursive `children` array) instead of
            a flat list.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of categories, or a category tree when `tree=true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createCategory
      summary: Create a category
      tags: ["Categories"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: The created category.
          headers:
            Location:
              description: URL of the created category.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      operationId: getCategory
      summary: Get a category by id
      tags: ["Categories"]
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCategory
      summary: Update a category
      tags: ["Categories"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCategory
      summary: Delete a category
      description: >-
        Hard-deletes the category. Categories have no `isActive` flag, so
        deletion is permanent. Fails with 409 if the category has any parts
        assigned to it or has child categories.
      tags: ["Categories"]
      responses:
        '204':
          description: The category was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

