      summary: List vehicle models
      tags: ["Vehicle Models"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: makeId
          in: query
          required: false
          description: Filter to models belonging to this vehicle make.
          schema:
            type: integer
        - name: classId
          in: query
          required: false
          description: Filter to models belonging to this vehicle class.
          schema:
            type: integer
      responses:
        '200':
          description: A page of vehicle models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleModelListResponse'
        '400':
