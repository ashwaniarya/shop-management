  /api/v1/parts:
    get:
      operationId: listParts
      summary: List parts
      tags: ["Parts"]
      description: >-
        Lists parts. When any of `vehicleClassId`, `vehicleMakeId` or
        `vehicleModelId` is supplied, results are filtered using a
        specificity-ladder match against each part's fitment rows: a part
        matches if it has a fitment naming the given model exactly, OR naming
        the given make with a null model (make-wide fitment), OR naming the
        given class with a null make (class-wide fitment). Parts with zero
        fitment rows are universal and are excluded whenever any vehicle
        filter is applied.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          required: false
          description: Free-text search over part name and description.
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: manufacturerId
          in: query
          required: false
          schema:
            type: integer
        - name: gradeId
          in: query
          required: false
          schema:
            type: integer
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
        - name: vehicleClassId
          in: query
          required: false
          description: Fitment filter. See the operation description for matching rules.
          schema:
            type: integer
        - name: vehicleMakeId
          in: query
          required: false
          description: Fitment filter. See the operation description for matching rules.
          schema:
            type: integer
        - name: vehicleModelId
          in: query
          required: false
          description: Fitment filter. See the operation description for matching rules.
          schema:
            type: integer
      responses:
        '200':
          description: A page of parts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createPart
      summary: Create a part
      tags: ["Parts"]
      description: >-
        Responds 409 if a part with this `sku`, or this `manufacturerId` +
        `manufacturerPartNumber` pair, already exists. Responds 400 when
        `copyOfPartId` names a part that is itself a copy (copy families are
        one level deep). Cross-manufacturer copy links are allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartCreate'
      responses:
        '201':
          description: The created part.
          headers:
            Location:
              description: URL of the created part.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/parts/search:
    get:
      operationId: searchParts
      summary: Search parts by any number type
      tags: ["Parts"]
      description: >-
        Searches the normalized forms of all four number types associated
        with parts: SKU, manufacturer part number, cross-reference numbers,
        and supplier part numbers. Returns one result per match, indicating
        which number type matched via `matchedBy` and the matched value via
        `matchedNumber`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: number
          in: query
          required: true
          description: The number to search for, matched against normalized forms.
          schema:
            type: string
      responses:
        '200':
          description: Matching parts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartSearchResultListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/parts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      operationId: getPart
      summary: Get a part by id
      tags: ["Parts"]
      description: >-
        Returns the part. Use `include` to embed related collections in a
        single call.
      parameters:
        - name: include
          in: query
          required: false
          description: Comma-separated related collections to embed in the response.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [fitments, crossReferences, suppliers, inventory]
      responses:
        '200':
          description: The part, with any requested related collections embedded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part360'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updatePart
      summary: Update a part
      tags: ["Parts"]
      description: >-
        Responds 409 if the updated `sku`, or `manufacturerId` +
        `manufacturerPartNumber` pair, conflicts with another part. Responds
        400 when `copyOfPartId` names a part that is itself a copy (copy
        families are one level deep), when this part already has copies
        linked to it, or on a self-link; cross-manufacturer copy links are
        allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartUpdate'
      responses:
        '200':
          description: The updated part.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deletePart
      summary: Soft-delete a part
      description: Sets `isActive` to `false`. Does not remove the row.
      tags: ["Parts"]
      responses:
        '204':
