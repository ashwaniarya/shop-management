    post:
      operationId: createVehicleModel
      summary: Create a vehicle model
      tags: ["Vehicle Models"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleModelCreate'
      responses:
        '201':
          description: The created vehicle model.
          headers:
            Location:
              description: URL of the created vehicle model.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleModel'
        '400':
