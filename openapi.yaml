  /api/v1/shops/{shopId}/inventory:
    parameters:
      - $ref: '#/components/parameters/ShopIdParam'
    get:
      operationId: listInventory
      summary: List inventory for a shop
      tags: ["Inventory"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: belowReorder
          in: query
          required: false
          description: If true, only include items where `quantityOnHand` <= `reorderLevel`.
          schema:
            type: boolean
        - name: categoryId
          in: query
          required: false
          description: Filter to inventory for parts in this category.
          schema:
            type: integer
        - name: q
          in: query
          required: false
          description: Free-text search over the linked part's name.
          schema:
            type: string
      responses:
        '200':
          description: A page of inventory rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryRowListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/shops/{shopId}/inventory/{partId}:
    parameters:
      - $ref: '#/components/parameters/ShopIdParam'
      - name: partId
        in: path
        required: true
        description: Part id.
        schema:
          type: integer
    get:
      operationId: getInventoryItem
      summary: Get the inventory record for a part in a shop
      tags: ["Inventory"]
      responses:
        '200':
          description: The inventory record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: upsertInventoryItem
      summary: Create or update the stock settings for a part in a shop
      tags: ["Inventory"]
      description: >-
        Creates the inventory record for this shop/part pair if it does not
        exist yet, otherwise updates it. Only stock settings (`reorderLevel`,
        `costPrice`, `sellingPrice`, `storageLocation`) can be written here.
        `quantityOnHand` is deliberately excluded from this endpoint's request
        body: it changes only as a side effect of posting stock transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemUpdate'
      responses:
        '200':
          description: The upserted inventory record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/shops/{shopId}/stock-transactions:
    parameters:
      - $ref: '#/components/parameters/ShopIdParam'
    get:
      operationId: listStockTransactions
      summary: List stock transactions for a shop
      description: >-
        Returns ledger rows sorted newest first. This ledger is append-only;
        there is no operation to update or delete a transaction.
      tags: ["Stock Transactions"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StockTransactionType'
        - name: partId
          in: query
          required: false
          schema:
            type: integer
        - name: userId
          in: query
          required: false
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: Only include transactions at or after this date-time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only include transactions at or before this date-time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A page of stock transactions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransactionListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createStockTransaction
      summary: Record a stock transaction
      description: >-
        Appends a row to the append-only stock ledger and atomically updates
        the shop/part `quantityOnHand` cache. There is no operation to update
        or delete a transaction; corrections must be posted as a new
        ADJUSTMENT transaction. Fails with 400 if a SALE would drive
        `quantityOnHand` below zero.
      tags: ["Stock Transactions"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransactionCreate'
      responses:
        '201':
          description: The recorded transaction.
          headers:
            Location:
              description: URL of the created transaction.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/shops/{shopId}/stock-transactions/summary:
    parameters:
      - $ref: '#/components/parameters/ShopIdParam'
    get:
      operationId: getStockTransactionsSummary
      summary: Summarize stock transactions for a shop
      tags: ["Stock Transactions"]
      parameters:
        - name: from
          in: query
          required: false
          description: Only include transactions at or after this date-time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only include transactions at or before this date-time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Totals grouped by transaction type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSummary'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Stub only. Every operation declares this security requirement for
        forward compatibility, but auth enforcement is not implemented yet.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-indexed).
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdParam:
      name: id
      in: path
      required: true
      description: Resource id.
      schema:
        type: integer
    ShopIdParam:
      name: shopId
      in: path
      required: true
      description: Shop id.
      schema:
        type: integer

  responses:
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: The request body or query parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with an existing resource (e.g. a unique-constraint violation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. `NOT_FOUND`, `VALIDATION_ERROR`, `CONFLICT`.
            message:
              type: string
              description: Human-readable error message.
            details:
              description: Additional structured context. Shape varies by `code` (e.g. field-level validation errors).

    Meta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: Total number of matching records across all pages.

    StockTransactionType:
      type: string
      enum: [SALE, PURCHASE, ADJUSTMENT]

    Manufacturer:
      type: object
      required: [id, name, code, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ManufacturerCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        code:
          type: [string, "null"]
    ManufacturerUpdate:
      type: object
      properties:
        name:
          type: string
        code:
          type: [string, "null"]
        isActive:
          type: boolean
    ManufacturerListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Manufacturer'
        meta:
          $ref: '#/components/schemas/Meta'

    Category:
      type: object
      required: [id, name, parentCategoryId, displayOrder]
      properties:
        id:
          type: integer
        name:
          type: string
        parentCategoryId:
          type: [integer, "null"]
        displayOrder:
          type: integer
    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parentCategoryId:
          type: [integer, "null"]
        displayOrder:
          type: integer
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        parentCategoryId:
          type: [integer, "null"]
        displayOrder:
          type: integer
    CategoryTree:
      description: A category with its descendants nested recursively.
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/CategoryTree'
    CategoryListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Category'
              - $ref: '#/components/schemas/CategoryTree'
        meta:
          $ref: '#/components/schemas/Meta'

    Supplier:
      type: object
      required: [id, name, contactPerson, phone, email, address, gstin, notes, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        contactPerson:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        email:
          type: [string, "null"]
        address:
          type: [string, "null"]
        gstin:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SupplierCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        contactPerson:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        email:
          type: [string, "null"]
        address:
          type: [string, "null"]
        gstin:
          type: [string, "null"]
        notes:
          type: [string, "null"]
    SupplierUpdate:
      type: object
      properties:
        name:
          type: string
        contactPerson:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        email:
          type: [string, "null"]
        address:
          type: [string, "null"]
        gstin:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        isActive:
          type: boolean
    SupplierListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
        meta:
          $ref: '#/components/schemas/Meta'

    VehicleClass:
      type: object
      required: [id, name, displayOrder, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        displayOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VehicleClassCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        displayOrder:
          type: integer
    VehicleClassUpdate:
      type: object
      properties:
        name:
