    get:
      operationId: getPartFamily
      summary: Get a part's copy family
      tags: ["Parts"]
      description: >-
        Returns the part's copy family: the original first, then its copies
        ordered by grade displayOrder (ungraded copies last). The same
        family is returned whether the id names the original or any copy;
        families are one level deep. Members are returned regardless of
        isActive.
      parameters:
        - name: shopId
          in: query
          required: false
          description: >-
            When given, each member additionally carries quantityOnHand and
            sellingPrice for that shop (null when the member is not stocked
            there); omitted otherwise.
          schema:
            type: integer
      responses:
        '200':
          description: The part's family, original first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartFamilyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

