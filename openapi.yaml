    patch:
      operationId: updateSupplier
      summary: Update a supplier
      tags: ["Suppliers"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierUpdate'
      responses:
        '200':
          description: The updated supplier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSupplier
      summary: Soft-delete a supplier
      description: Sets `isActive` to `false`. Does not remove the row.
      tags: ["Suppliers"]
      responses:
        '204':
          description: The supplier was deactivated.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/vehicle-classes:
    get:
      operationId: listVehicleClasses
      summary: List vehicle classes
      tags: ["Vehicle Classes"]
