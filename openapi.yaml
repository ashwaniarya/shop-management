    StockTransaction:
      type: object
      required: [id, shopId, partId, userId, type, quantity, unitPrice, notes, createdAt]
      properties:
        id:
          type: integer
        shopId:
          type: integer
        partId:
          type: integer
        userId:
          type: integer
        type:
          $ref: '#/components/schemas/StockTransactionType'
        quantity:
          type: number
          description: >-
            Signed quantity delta applied to `quantityOnHand` by this
            transaction: negative for SALE, positive for PURCHASE, and
            as-entered for ADJUSTMENT.
        unitPrice:
          type: [number, "null"]
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    StockTransactionCreate:
      type: object
      required: [partId, userId, type, quantity]
      properties:
        partId:
          type: integer
        userId:
          type: integer
        type:
          $ref: '#/components/schemas/StockTransactionType'
        quantity:
          type: number
          description: >-
            Always entered as a positive number for SALE and PURCHASE; the
            API applies the sign automatically (PURCHASE increases
            `quantityOnHand`, SALE decreases it). For ADJUSTMENT, pass the
            signed delta directly (positive to increase stock, negative to
            decrease); it is applied to `quantityOnHand` as-is.
        unitPrice:
          type: [number, "null"]
          description: Required for SALE and PURCHASE. Optional for ADJUSTMENT.
        notes:
          type: [string, "null"]
    StockTransactionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockTransaction'
        meta:
          $ref: '#/components/schemas/Meta'
    TransactionSummary:
      type: object
      required: [sales, purchases, adjustments]
      properties:
        sales:
          type: object
          required: [count, quantity, revenue]
          properties:
            count:
              type: integer
            quantity:
              type: number
            revenue:
              type: number
        purchases:
          type: object
          required: [count, quantity, cost]
          properties:
            count:
              type: integer
            quantity:
              type: number
            cost:
              type: number
        adjustments:
          type: object
          required: [count, quantity]
          properties:
            count:
              type: integer
            quantity:
              type: number
              description: >-
                The absolute value of the net signed sum of adjustment rows
                (positive and negative adjustments offset each other before
                the absolute value is taken).

    PartSearchResult:
      description: A part matched by a number search, with details of what matched.
      allOf:
